name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libnm-dev libgtk-3-dev libgtk-4-dev python3 \
            libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build and validate plugin
        run: |
          make all
          ./validate-plugin ./libnm-vpn-plugin-wproxy.so
      - name: Unit, syntax and release checks
        run: make test
  windows-source:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Tauri desktop on Windows
        shell: powershell
        run: |
          Push-Location desktop
          npm ci
          npm run build
          Pop-Location
          cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Shared parser, routing and update tests
        run: python -m unittest tests/test_routing.py tests/test_runtime.py tests/test_updates.py tests/test_release.py tests/test_connect.py -v
      - name: Parse PowerShell frontends
        shell: powershell
        run: |
          Get-ChildItem windows -Filter *.ps1 | ForEach-Object {
            [void][ScriptBlock]::Create((Get-Content $_.FullName -Raw))
          }
