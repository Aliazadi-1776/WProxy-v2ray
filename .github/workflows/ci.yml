name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libnm-dev libgtk-3-dev libgtk-4-dev python3 nodejs
      - name: Build and validate plugin
        run: |
          make all
          ./validate-plugin ./libnm-vpn-plugin-wproxy.so
      - name: Unit, syntax and release checks
        run: make test
  windows-source:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Shared parser and routing tests
        run: python -m unittest tests/test_routing.py -v
      - name: Parse PowerShell frontends
        shell: powershell
        run: |
          Get-ChildItem windows -Filter *.ps1 | ForEach-Object {
            [void][ScriptBlock]::Create((Get-Content $_.FullName -Raw))
          }
