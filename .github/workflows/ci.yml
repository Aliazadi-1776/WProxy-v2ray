name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libnm-dev libgtk-3-dev libgtk-4-dev python3 nodejs
      - name: Build and validate plugin
        run: |
          make all
          ./validate-plugin ./libnm-vpn-plugin-wproxy.so
      - name: Unit, syntax and release checks
        run: make test
