name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  WPROXY_VERSION: '2.7.5'
  XRAY_VERSION: '26.9.30'
  XRAY_SHA256: 'b17a619343c11b89d8faf36278298856749b15c52277d875d32051b33dcda617'

jobs:
  installer:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Run shared Windows tests
        run: python -m unittest tests/test_routing.py tests/test_runtime.py tests/test_updates.py tests/test_release.py -v
      - name: Build source and Plasma packages
        run: python scripts/build-release.py --output dist
      - name: Build standalone command engine
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3
          pyinstaller --noconfirm --clean --onefile --console --name wproxyctl --distpath build/windows cli/wproxyctl.py
          .\build\windows\wproxyctl.exe --version
      - name: Build Tauri desktop
        shell: powershell
        run: |
          Push-Location desktop
          npm ci
          npm run build
          Pop-Location
          cargo build --release --locked --manifest-path desktop/src-tauri/Cargo.toml
          python tests/check-tauri-production.py desktop/src-tauri/target/release/wproxy-desktop.exe
          Copy-Item desktop/src-tauri/target/release/wproxy-desktop.exe build/windows/WProxy.exe
          if (-not (Test-Path build/windows/WProxy.exe)) { throw 'Tauri desktop executable was not built' }
      - name: Smoke test Tauri startup on Windows
        shell: powershell
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'wproxy-tauri-profile'
          $process = Start-Process -FilePath (Resolve-Path 'build/windows/WProxy.exe') `
            -WorkingDirectory (Resolve-Path 'build/windows') -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Tauri desktop exited during startup with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - name: Verify Unicode server names through PowerShell
        shell: powershell
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'wproxy-unicode-profile'
          $uri = 'trojan://test-password@example.com:443?security=tls#%F0%9F%87%A9%F0%9F%87%AA%20Berlin'
          & .\build\windows\wproxyctl.exe node add $uri
          if ($LASTEXITCODE -ne 0) { throw 'Could not add the Unicode smoke-test server' }
          $nodes = @(& .\build\windows\wproxyctl.exe node list --json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $nodes.Count -ne 1) { throw 'Could not read the Unicode smoke-test server' }
          $expected = [char]::ConvertFromUtf32(0x1F1E9) + [char]::ConvertFromUtf32(0x1F1EA) + ' Berlin'
          if ($nodes[0].name -ne $expected) { throw "Unicode server name was corrupted: $($nodes[0].name)" }
      - name: Download and verify official Xray runtime
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'Xray-windows-64.zip'
          $url = "https://github.com/XTLS/Xray-core/releases/download/v$env:XRAY_VERSION/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:XRAY_SHA256) { throw "Xray archive hash mismatch: $actual" }
          New-Item -ItemType Directory -Force build/windows/xray | Out-Null
          Expand-Archive -Path $archive -DestinationPath build/windows/xray -Force
          foreach ($name in @('xray.exe', 'wintun.dll', 'geoip.dat', 'geosite.dat', 'LICENSE', 'LICENSE-Wintun')) {
            if (-not (Test-Path (Join-Path 'build/windows/xray' $name))) { throw "Xray archive is missing $name" }
          }
          python cli/wproxyctl.py render 'trojan://test-password@example.com:443?security=tls' --platform windows --output build/windows/xray-schema.json
          & .\build\windows\xray\xray.exe run -test -c build/windows/xray-schema.json
          if ($LASTEXITCODE -ne 0) { throw "Bundled Xray rejected the generated Windows TUN configuration" }
      - name: Compile Setup.exe
        shell: powershell
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler is unavailable' }
          $build = (Resolve-Path 'build/windows').Path
          & $iscc "/DMyVersion=$env:WPROXY_VERSION" "/DMyBuildDir=$build" 'windows\WProxy.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = "dist/WProxy-$env:WPROXY_VERSION-Setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "$hash  WProxy-$env:WPROXY_VERSION-Setup.exe" | Set-Content -Encoding ascii "$setup.sha256"
      - name: Test installed native Windows UI and command bridge
        timeout-minutes: 4
        shell: powershell
        run: |
          $installed = Join-Path $env:RUNNER_TEMP 'wproxy-installed-test'
          $setup = (Resolve-Path "dist/WProxy-$env:WPROXY_VERSION-Setup.exe").Path
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installed`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup installation failed: $($install.ExitCode)" }
          node tests/windows-desktop-smoke.mjs $installed build/windows/test-results
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows UI/bridge test failed' }
      - name: Test installed Windows Wintun, DNS, HTTPS and rollback
        timeout-minutes: 5
        shell: powershell
        run: |
          $installed = Join-Path $env:RUNNER_TEMP 'wproxy-installed-test'
          python tests/windows-tunnel-smoke.py $installed build/windows/test-results
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows TUN test failed' }
      - name: Upload native Windows test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WProxy-native-Windows-test-evidence
          path: build/windows/test-results
          if-no-files-found: warn
      - name: Create release checksum manifest
        shell: powershell
        run: |
          $names = @(
            "WProxy-$env:WPROXY_VERSION-Setup.exe",
            "WProxy-$env:WPROXY_VERSION-GitHub.zip",
            "WProxy-$env:WPROXY_VERSION-Plasma6.plasmoid"
          )
          $lines = foreach ($name in $names) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path 'dist' $name)).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: WProxy-${{ env.WPROXY_VERSION }}-release
          path: |
            dist/WProxy-${{ env.WPROXY_VERSION }}-Setup.exe
            dist/WProxy-${{ env.WPROXY_VERSION }}-Setup.exe.sha256
            dist/WProxy-${{ env.WPROXY_VERSION }}-GitHub.zip
            dist/WProxy-${{ env.WPROXY_VERSION }}-Plasma6.plasmoid
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/WProxy-$env:WPROXY_VERSION-Setup.exe" `
            "dist/WProxy-$env:WPROXY_VERSION-Setup.exe.sha256" `
            "dist/WProxy-$env:WPROXY_VERSION-GitHub.zip" `
            "dist/WProxy-$env:WPROXY_VERSION-Plasma6.plasmoid" `
            "dist/SHA256SUMS" `
            --title "WProxy $env:WPROXY_VERSION" --generate-notes --verify-tag
