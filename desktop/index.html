    <button class="icbtn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
  </div>
  <div class="sheet-b" id="sheetBody"></div>
  <div class="sheet-f" id="sheetFoot"></div>
</aside>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-h" id="modalHead"></div>
  <div class="modal-b" id="modalBody"></div>
  <div class="modal-f" id="modalFoot"></div>
</div>

<div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="pal-i">
    <svg viewBox="0 0 24 24"><use href="#i-search"/></svg>
    <input id="palInput" placeholder="Search servers, pages and actions…" autocomplete="off" spellcheck="false">
    <kbd style="font-family:var(--ff-mono);font-size:10px;padding:2px 6px;border-radius:5px;background:var(--panel-4);border:1px solid var(--line);color:var(--ink-3)">Esc</kbd>
  </div>
  <div class="pal-l" id="palList"></div>
  <div class="pal-f">
    <span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span>
    <span style="margin-left:auto" class="mono" id="palCount"></span>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
