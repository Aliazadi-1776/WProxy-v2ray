[package]
name = "wproxy-desktop"
version = "2.7.7"
description = "A lightweight cross-platform desktop client for WProxy"
authors = ["WProxy contributors"]
license = "MIT"
repository = "https://github.com/Aliazadi-1776/WProxy-v2ray"
edition = "2021"
rust-version = "1.90"

[lib]
name = "wproxy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wproxy-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
